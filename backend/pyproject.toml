[project]
name = "repflow-garmin"
version = "0.1.0"
description = "Fill Garmin Connect's native strength table from a RepFlow activity"
requires-python = ">=3.10"
dependencies = [
    "garminconnect>=0.3.2",
    "fitdecode>=0.10.0",
]

[project.optional-dependencies]
# Encoding a FIT file is only needed to build test fixtures; reading one is not.
dev = ["pytest>=8", "garmin-fit-sdk>=21.141"]

[project.scripts]
repflow-garmin = "repflow_garmin.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["repflow_garmin*"]

[tool.setuptools.package-data]
repflow_garmin = ["data/*.json"]
