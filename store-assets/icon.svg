<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    RepFlow launcher icon.

    **One silhouette, one colour, no ground.** That is what an activity icon is
    on this watch — running figure, bike, swimmer — and anything drawn behind
    the mark announces the app as a visitor before it has done anything.

    The colour is doing a job a white glyph could not. A launcher background is
    not something an app gets to choose, and the two it lands on are opposites:
    the watch's own app list is black, Garmin Connect's phone list is white. A
    white barbell disappeared on the phone; a disc behind it fixed that and
    looked like a badge. Garmin's own accent blue is legible on both grounds and
    is already the colour of this ecosystem, so it solves the problem by
    belonging rather than by fencing the mark off.

    The mark fills its frame the way Garmin's do. Strokes are no thinner than
    about 8% of the width, because the launcher renders this between 33 and 80
    pixels across and anything finer disappears at the small end.

    Two plates a side — the inner tall, the outer short — because that
    silhouette still reads as a loaded bar at 33 pixels, where a single plate a
    side reads as a bone.
  -->
  <g fill="#0092E4">
    <rect x="54"  y="210" width="44"  height="92"  rx="15"/>
    <rect x="112" y="160" width="64"  height="192" rx="22"/>
    <rect x="336" y="160" width="64"  height="192" rx="22"/>
    <rect x="414" y="210" width="44"  height="92"  rx="15"/>
    <rect x="164" y="228" width="184" height="56"  rx="19"/>
  </g>
</svg>
