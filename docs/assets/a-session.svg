<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250"
     role="img" aria-label="A session, start to finish: choose a workout, lift a set, rest, and get a recap.">
  <title>A session, start to finish</title>

  <rect width="1000" height="250" fill="#07080A"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">

    <!-- Lift and rest are a loop, not two steps in a row. -->
    <path d="M 615 168 C 615 206, 375 206, 375 172" fill="none" stroke="#2A3340"
          stroke-width="2.5" stroke-dasharray="5 7" stroke-linecap="round"/>
    <path d="M 375 172 l -6 -10 l 12 0 z" fill="#2A3340"/>
    <text x="495" y="234" fill="#4E5866" font-size="16" font-weight="600" text-anchor="middle">
      as many times as it takes
    </text>

    <!-- four steps -->
    <g>
      <g>
        <rect x="40" y="52" width="190" height="104" rx="16" fill="#0D1117" stroke="#1F2731" stroke-width="2"/>
        <rect x="40" y="52" width="190" height="104" rx="16" fill="none" stroke="#00AAFF" stroke-width="2.5" opacity="1">
          <animate attributeName="opacity" values="1;1;0;0;0;0;0;0;1" keyTimes="0;0.20;0.26;0.45;0.51;0.70;0.76;0.95;1" dur="9s" repeatCount="indefinite"/>
        </rect>
        <text x="135" y="95" fill="#00AAFF" font-size="15" font-weight="700" letter-spacing="2.5" text-anchor="middle">1</text>
        <text x="135" y="124" fill="#E7ECF2" font-size="23" font-weight="700" text-anchor="middle">Choose</text>
      </g>

      <g>
        <rect x="280" y="52" width="190" height="104" rx="16" fill="#0D1117" stroke="#1F2731" stroke-width="2"/>
        <rect x="280" y="52" width="190" height="104" rx="16" fill="none" stroke="#00AAFF" stroke-width="2.5" opacity="0">
          <animate attributeName="opacity" values="0;0;1;1;0;0;0;0;0" keyTimes="0;0.20;0.26;0.45;0.51;0.70;0.76;0.95;1" dur="9s" repeatCount="indefinite"/>
        </rect>
        <text x="375" y="95" fill="#00AAFF" font-size="15" font-weight="700" letter-spacing="2.5" text-anchor="middle">2</text>
        <text x="375" y="124" fill="#E7ECF2" font-size="23" font-weight="700" text-anchor="middle">Lift a set</text>
      </g>

      <g>
        <rect x="520" y="52" width="190" height="104" rx="16" fill="#0D1117" stroke="#1F2731" stroke-width="2"/>
        <rect x="520" y="52" width="190" height="104" rx="16" fill="none" stroke="#00AAFF" stroke-width="2.5" opacity="0">
          <animate attributeName="opacity" values="0;0;0;0;1;1;0;0;0" keyTimes="0;0.20;0.26;0.45;0.51;0.70;0.76;0.95;1" dur="9s" repeatCount="indefinite"/>
        </rect>
        <text x="615" y="95" fill="#00AAFF" font-size="15" font-weight="700" letter-spacing="2.5" text-anchor="middle">3</text>
        <text x="615" y="124" fill="#E7ECF2" font-size="23" font-weight="700" text-anchor="middle">Rest</text>
      </g>

      <g>
        <rect x="760" y="52" width="200" height="104" rx="16" fill="#0D1117" stroke="#1F2731" stroke-width="2"/>
        <rect x="760" y="52" width="200" height="104" rx="16" fill="none" stroke="#00AA55" stroke-width="2.5" opacity="0">
          <animate attributeName="opacity" values="0;0;0;0;0;0;1;1;0" keyTimes="0;0.20;0.26;0.45;0.51;0.70;0.76;0.95;1" dur="9s" repeatCount="indefinite"/>
        </rect>
        <text x="860" y="95" fill="#00AA55" font-size="15" font-weight="700" letter-spacing="2.5" text-anchor="middle">4</text>
        <text x="860" y="124" fill="#E7ECF2" font-size="23" font-weight="700" text-anchor="middle">Recap</text>
      </g>
    </g>

    <!-- what each step actually is, in one line -->
    <g fill="#6B7684" font-size="16" text-anchor="middle">
      <text x="135" y="36">any exercise on the list</text>
      <text x="375" y="36">weight, reps, effort</text>
      <text x="615" y="36">countdown, or until you say</text>
      <text x="860" y="36">what you did, what it cost</text>
    </g>
  </g>
</svg>
